name: Benchmark
on:
  push:
    branches: main
jobs:
  benchmark_with_bencher:
    name: Benchmark with Bencher
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    env:
      BENCHER_PROJECT: relaxng-rust
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: bencherdev/bencher@main
      - uses: cargo-bins/cargo-binstall@main

      - run: sudo apt update && sudo apt install valgrind

      - name: Install gungraun-runner
        run: |
          version=$(cargo metadata --format-version=1 |\
            jq '.packages[] | select(.name == "gungraun").version' |\
            tr -d '"'
          )
          cargo binstall --no-confirm gungraun-runner --version $version --root $PWD/gungraun/

      - run: |
          GUNGRAUN_COLOR=never GUNGRAUN_RUNNER=$PWD/gungraun/bin/gungraun-runner cargo bench --bench ci_bench > perf.txt
      - run: |
          bencher run \
          --branch "$GITHUB_REF_NAME" \
          --testbed ubuntu-24.04 \
          --threshold-measure instructions \
          --threshold-test percentage \
          --threshold-max-sample-size 64 \
          --threshold-upper-boundary 0.02 \
          --thresholds-reset \
          --error-on-alert \
          --github-actions "${{ secrets.GITHUB_TOKEN }}" \
          --adapter rust_gungraun \
          --hash "$GITHUB_SHA" \
          --file "perf.txt"
